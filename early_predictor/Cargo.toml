[package]
name = "ic3-param-predictor"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "aig2feat"
path = "src/main.rs"

[dependencies]
arrow = "54.2.1"
arrow-array = "54.2.1"
arrow-schema = "54.2.1"
parquet = "54.2.1"
lazy_static = "1.4"
tempfile = "3.2"
tonic = "0.10"
prost = "0.12"
anyhow = "1.0"
pyo3 = { version = "0.19", features = ["auto-initialize"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.0"
